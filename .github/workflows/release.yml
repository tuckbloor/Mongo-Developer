name: Windows Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Tests
        run: |
          go test ./internal/...
          cd frontend
          npm test
          npm run build
      - name: Build NSIS installer
        run: wails build -clean -platform windows/amd64 -nsis
      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem -Recurse -File build\bin\*.exe | Where-Object { $_.Name -match 'installer|setup' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem -File build\bin\*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1 }
          if (-not $installer) { throw 'No installer executable found.' }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $target = "dist\MongoDeveloper-Setup-$version.exe"
          Copy-Item $installer.FullName $target
          $hash=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$target.sha256" "$hash  MongoDeveloper-Setup-$version.exe" -Encoding ascii
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "Mongo Developer ${{ github.ref_name }}"
